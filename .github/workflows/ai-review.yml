name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build CLI
        run: bun run build

      - name: Run review (base branch)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_CODE_REVIEW_API_KEY: ${{ secrets.AI_CODE_REVIEW_API_KEY }}
        run: |
          BASE="${{ github.base_ref }}"
          bun run dist/app.js review --base "$BASE" --output github --output-file review-comment.md --fail-on none || true

      - name: Post PR comment
        if: always() && hashFiles('review-comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('review-comment.md')) return;
            const body = fs.readFileSync('review-comment.md', 'utf8');
            const marker = '<!-- ai-review-cli -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            const fullBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: fullBody,
              });
            }